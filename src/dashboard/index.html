<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naukri Auto Bot Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #fb923c;
      --primary-hover: #f97316;
      --success: #10b981;
      --waiting: #f59e0b;
      --failed: #ef4444;
      --skipped: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(to right, var(--primary), #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .settings-panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .switch-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Switch Slider CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #475569;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:focus + .slider {
      box-shadow: 0 0 1px var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .stat-val {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Tabs & Filters */
    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background-color: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    /* Table & Cards list */
    .job-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .job-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
    }

    .job-info {
      flex: 1;
    }

    .job-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-queued { background-color: rgba(94, 234, 212, 0.15); color: #2dd4bf; }
    .badge-applied { background-color: rgba(16, 185, 129, 0.15); color: var(--success); }
    .badge-input { background-color: rgba(245, 158, 11, 0.15); color: var(--waiting); }
    .badge-skipped { background-color: rgba(100, 116, 139, 0.15); color: var(--text-muted); }
    .badge-failed { background-color: rgba(239, 68, 68, 0.15); color: var(--failed); }

    .error-msg {
      font-size: 0.85rem;
      color: var(--failed);
      margin-top: 0.5rem;
      background-color: rgba(239, 68, 68, 0.05);
      padding: 0.5rem;
      border-radius: 6px;
      border-left: 3px solid var(--failed);
    }

    /* Forms for custom input answering */
    .answer-form {
      background-color: rgba(245, 158, 11, 0.05);
      border: 1px dashed var(--waiting);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      max-width: 500px;
    }

    .answer-form h4 {
      font-size: 1rem;
      color: var(--waiting);
      margin-bottom: 0.75rem;
    }

    .form-group {
      margin-bottom: 0.75rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-submit {
      background-color: var(--primary);
      color: #000;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    /* Actions column */
    .job-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .external-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .external-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Naukri Bot Control Panel</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">Monitor applications queue and reply to forms</p>
      </div>

      <div class="settings-panel">
        <span style="font-weight: 600;">Dry Run Mode:</span>
        <div class="switch-container">
          <label class="switch">
            <input type="checkbox" id="dryRunToggle" onchange="toggleDryRun(this.checked)">
            <span class="slider"></span>
          </label>
          <span id="dryRunLabel" style="font-size: 0.9rem; color: var(--text-muted);">Enabled</span>
        </div>
      </div>
    </header>

    <!-- Stats summary widgets -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="stat-total">0</div>
        <div class="stat-label">Total Jobs</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-applied" style="color: var(--success)">0</div>
        <div class="stat-label">Applied</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-waiting" style="color: var(--waiting)">0</div>
        <div class="stat-label">Needs Input</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-queued" style="color: #2dd4bf">0</div>
        <div class="stat-label">Queued</div>
      </div>
    </div>

    <!-- Navigation tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-all" onclick="setFilter('ALL')">All Jobs</button>
      <button class="tab-btn" id="tab-queued" onclick="setFilter('QUEUED')">Queued</button>
      <button class="tab-btn" id="tab-applied" onclick="setFilter('APPLIED')">Applied</button>
      <button class="tab-btn" id="tab-waiting" onclick="setFilter('NEEDS_USER_INPUT')">Needs Input</button>
      <button class="tab-btn" id="tab-skipped" onclick="setFilter('SKIPPED')">Skipped</button>
    </div>

    <!-- Job Cards Listing -->
    <div class="job-list" id="jobListContainer">
      <div style="text-align: center; color: var(--text-muted); padding: 3rem;">Loading records database...</div>
    </div>
  </div>

  <script>
    let currentFilter = 'ALL';
    let jobsData = [];

    // Fetch and load initial data
    async function refreshDashboard() {
      try {
        const statsRes = await fetch('/api/stats');
        const stats = await statsRes.json();
        
        document.getElementById('stat-total').innerText = stats.total || 0;
        document.getElementById('stat-applied').innerText = stats.applied || 0;
        document.getElementById('stat-waiting').innerText = stats.waiting || 0;
        document.getElementById('stat-queued').innerText = stats.queued || 0;
        
        const isDryRun = stats.dryRun;
        const toggleEle = document.getElementById('dryRunToggle');
        toggleEle.checked = isDryRun;
        document.getElementById('dryRunLabel').innerText = isDryRun ? 'Enabled' : 'Disabled';
        document.getElementById('dryRunLabel').style.color = isDryRun ? 'var(--primary)' : 'var(--success)';

        const jobsRes = await fetch('/api/applications');
        jobsData = await jobsRes.json();
        renderJobs();
      } catch (err) {
        console.error('Error loading dashboard:', err);
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtnId = 'tab-' + (filter === 'NEEDS_USER_INPUT' ? 'waiting' : filter.toLowerCase());
      const btn = document.getElementById(activeBtnId);
      if (btn) btn.classList.add('active');
      renderJobs();
    }

    function renderJobs() {
      const container = document.getElementById('jobListContainer');
      container.innerHTML = '';

      const filtered = jobsData.filter(j => currentFilter === 'ALL' || j.status === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 3rem;">No jobs match this status filter.</div>';
        return;
      }

      filtered.forEach(job => {
        const card = document.createElement('div');
        card.className = 'job-card';

        let badgeClass = 'badge-queued';
        if (job.status === 'APPLIED') badgeClass = 'badge-applied';
        if (job.status === 'NEEDS_USER_INPUT') badgeClass = 'badge-input';
        if (job.status === 'SKIPPED') badgeClass = 'badge-skipped';
        if (job.status === 'FAILED') badgeClass = 'badge-failed';

        let descContent = '';
        if (job.error_message) {
          descContent = `<div class="error-msg">${job.error_message}</div>`;
        }

        // Generate form if answer is required
        let answerFormHtml = '';
        if (job.status === 'NEEDS_USER_INPUT' && job.questions && job.questions.length > 0) {
          answerFormHtml = `
            <div class="answer-form">
              <h4>📋 Questionnaire Solver</h4>
              <form onsubmit="submitFormAnswers(event, ${job.application_id})">
                ${job.questions.map(q => `
                  <div class="form-group">
                    <label>${q.question_text}</label>
                    <input type="text" name="question-${q.id}" required placeholder="Type answer...">
                  </div>
                `).join('')}
                <button type="submit" class="btn-submit">Submit Answers & Queue</button>
              </form>
            </div>
          `;
        }

        let retryBtnHtml = '';
        if (job.status !== 'QUEUED' && job.status !== 'APPLYING') {
          retryBtnHtml = `<button onclick="requeueApplication(${job.application_id})" class="btn-submit" style="margin-top: 0.5rem; background-color: var(--waiting); font-size: 0.8rem; padding: 0.3rem 0.6rem;">Re-Queue</button>`;
        }

        card.innerHTML = `
          <div class="job-info">
            <div class="job-title">${job.title}</div>
            <div class="job-meta">
              <span>🏢 ${job.company}</span>
              <span>📍 ${job.location || 'Not Specified'}</span>
              <span>💼 experience: ${job.experience || 'Not Spec'}</span>
              <span>📅 Parsed: ${new Date(job.created_at).toLocaleDateString()}</span>
            </div>
            ${descContent}
            ${answerFormHtml}
          </div>
          <div class="job-actions">
            <span class="badge ${badgeClass}">${job.status}</span>
            ${retryBtnHtml}
            <a href="${job.url}" target="_blank" class="external-link" style="margin-top: 0.5rem;">Open Naukri ↗</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function requeueApplication(appId) {
      try {
        const response = await fetch('/api/applications/requeue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ applicationId: appId })
        });
        if (response.ok) {
          refreshDashboard();
        } else {
          alert('Failed to requeue application.');
        }
      } catch (err) {
        console.error('Error requeuing application:', err);
      }
    }

    async function toggleDryRun(checked) {
      try {
        await fetch('/api/settings/dryrun', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dryRun: checked })
        });
        refreshDashboard();
      } catch (err) {
        console.error('Error toggling dry run:', err);
      }
    }

    async function submitFormAnswers(event, appId) {
      event.preventDefault();
      const form = event.target;
      const inputs = Array.from(form.querySelectorAll('input'));
      
      const answersMap = inputs.map(input => {
        const qId = parseInt(input.name.split('-')[1], 10);
        return {
          questionId: qId,
          answerText: input.value.trim()
        };
      });

      try {
        const response = await fetch('/api/applications/answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ applicationId: appId, answers: answersMap })
        });

        if (response.ok) {
          alert('Answers updated successfully! Job is queued.');
          refreshDashboard();
        } else {
          alert('Failed to update answers.');
        }
      } catch (err) {
        console.error('Error sending answers:', err);
      }
    }

    // Run poll every 8 seconds
    refreshDashboard();
    setInterval(refreshDashboard, 8000);
  </script>
</body>
</html>
